
name: Build PlusClient Java 21

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 9.2.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Check environment
        run: |
          java -version
          gradle --version

            - name: Build PlusClient
        run: |
          gradle clean build --no-daemon --stacktrace --info

      - name: Collect JAR files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          find . -type f \
            -path "*/build/libs/*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} release/ \;

          if ! find release -name '*.jar' -print -quit | grep -q .; then
            echo "ERROR: No JAR files found"
            exit 1
          fi

          ls -lh release/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PlusClient-Java21
          path: release/*.jar
          if-no-files-found: error
          retention-days: 7
          
