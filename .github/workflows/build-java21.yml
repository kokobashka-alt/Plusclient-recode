
name: Build PlusClient Java 21

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          WRAPPER=$(find . -type f -name gradlew \
            -not -path "*/.gradle/*" | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found"
            echo "Project files:"
            find . -maxdepth 3 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project: $PROJECT_DIR"

      - name: Build with Java 21
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon

      - name: Collect JAR files
        shell: bash
        run: |
          set -e

          mkdir -p release

          find "$PROJECT_DIR" -type f \
            -path "*/build/libs/*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} release/ \;

          if [ -z "$(find release -type f -name '*.jar' -print -quit)" ]; then
            echo "ERROR: No JAR files found"
            exit 1
          fi

          ls -lah release

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PlusClient-Java21
          path: release/*.jar
          if-no-files-found: error
          retention-days: 7
          
