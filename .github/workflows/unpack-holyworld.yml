
name: Upload Holyworld Folder

on:
  workflow_dispatch:
  push:
    paths:
      - "holyworld.7z"
      - ".github/workflows/unpack-holyworld.yml"

permissions:
  contents: write

jobs:
  unpack-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract archive
        run: |
          mkdir -p extracted
          7z x holyworld.7z -oextracted -y

          if [ ! -d "extracted/holyworld" ]; then
            echo "Folder holyworld not found inside archive"
            exit 1
          fi

      - name: Upload holyworld to source
        run: |
          mkdir -p src/main/java/dev/leg1tka/rotation

          rm -rf src/main/java/dev/leg1tka/rotation/holyworld

          cp -a extracted/holyworld \
            src/main/java/dev/leg1tka/rotation/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/java/dev/leg1tka/rotation/holyworld

          if git diff --cached --quiet; then
            echo "No changes to upload"
            exit 0
          fi

          git commit -m "Upload Holyworld rotation sources"
          git push
          
