
name: Import PlusClient Libraries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download libs.zip
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/kokobashka-alt/Plusclient-recode/releases/tags/1.0"

          URL=$(curl -fsSL "$API" | jq -r \
            '.assets[] | select(.name == "libs.zip") | .browser_download_url' | head -n 1)

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "ERROR: libs.zip not found in Release 1.0"
            exit 1
          fi

          curl -fL "$URL" -o libs.zip
          test -s libs.zip

      - name: Verify ZIP
        run: |
          unzip -t libs.zip

      - name: Extract libraries
        shell: bash
        run: |
          set -euo pipefail

          mkdir extracted
          unzip -q libs.zip -d extracted

          echo "Archive structure:"
          find extracted -maxdepth 5 -print

      - name: Locate libs directory
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t DIRS < <(find extracted -type d -name libs)

          if [ "${#DIRS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one libs directory"
            find extracted -maxdepth 5 -print
            exit 1
          fi

          echo "LIBS_DIR=${DIRS[0]}" >> "$GITHUB_ENV"

      - name: Copy libraries
        run: |
          set -euo pipefail

          rm -rf libs
          mkdir -p libs
          cp -a "$LIBS_DIR/." libs/

          echo "Imported libraries:"
          find libs -maxdepth 4 -type f -print

          if [ ! -f libs/fabric-loader-0.19.2.jar ]; then
            echo "ERROR: fabric-loader-0.19.2.jar is missing"
            exit 1
          fi

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A libs/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Import PlusClient libraries"
          git push
          
