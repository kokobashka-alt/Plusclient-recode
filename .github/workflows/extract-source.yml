
name: Extract Mappings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Release 1.0 assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p archive

          gh release download 1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --dir archive

          echo "Downloaded files:"
          ls -lah archive/

      - name: Find and extract mappings ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          found=false

          for file in archive/*.zip; do
            [ -f "$file" ] || continue

            echo "Checking: $file"

            if unzip -Z1 "$file" | grep -qE '(^|/)original-abi\.json$'; then
              echo "Mappings archive found: $file"
              unzip -o "$file" -d extracted
              found=true
              break
            fi
          done

          if [ "$found" != true ]; then
            echo "ERROR: No ZIP containing original-abi.json found"
            echo "Archive contents:"
            for file in archive/*.zip; do
              [ -f "$file" ] || continue
              echo "---- $file ----"
              unzip -Z1 "$file"
            done
            exit 1
          fi

          source_file="$(find extracted -type f -name original-abi.json -print -quit)"

          if [ -z "$source_file" ]; then
            echo "ERROR: original-abi.json extraction failed"
            exit 1
          fi

          source_dir="$(dirname "$source_file")"

          rm -rf mappings
          mkdir -p mappings

          cp -a "$source_dir/." mappings/

          test -f mappings/original-abi.json

          echo "Mappings files:"
          find mappings -type f

      - name: Commit and push mappings
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mappings/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Import mappings"
          git push
          
