
name: Check Mappings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check mappings folder
        run: |
          set -euo pipefail

          echo "Repository root:"
          ls -lah

          if [ ! -d "mappings" ]; then
            echo "ERROR: mappings folder not found in repository root"
            exit 1
          fi

          echo "Mappings contents:"
          find mappings -maxdepth 3 -type f

          if [ ! -f "mappings/original-abi.json" ]; then
            echo "ERROR: mappings/original-abi.json not found"
            exit 1
          fi

          echo "SUCCESS: original-abi.json found"

      - name: Commit mappings
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mappings/

          if git diff --cached --quiet; then
            echo "Mappings already committed"
          else
            git commit -m "Add mappings files"
            git push
          fi
          
