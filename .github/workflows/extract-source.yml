
name: Extract Mappings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract mappings.zip
        run: |
          set -euo pipefail

          if [ ! -f "mappings.zip" ]; then
            echo "ERROR: mappings.zip not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -o mappings.zip -d extracted

          echo "Archive contents:"
          find extracted -maxdepth 4 -type f

          source_file="$(find extracted -type f -name original-abi.json -print -quit)"

          if [ -z "$source_file" ]; then
            echo "ERROR: original-abi.json not found inside mappings.zip"
            exit 1
          fi

          source_dir="$(dirname "$source_file")"

          rm -rf mappings
          mkdir -p mappings
          cp -a "$source_dir/." mappings/

          test -f mappings/original-abi.json

          echo "Mappings extracted successfully"

      - name: Commit mappings
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mappings/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract mappings archive"
            git push
          fi
          
