
name: Extract Default Gradle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Download default.gradle.7z
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/kokobashka-alt/Plusclient-recode/releases/tags/1.0"

          URL=$(curl -fsSL "$API" | jq -r \
            '.assets[] | select(.name == "default.gradle.7z") | .browser_download_url' | head -n 1)

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "Archive not found"
            exit 1
          fi

          curl -fL "$URL" -o default.gradle.7z

      - name: Extract archive
        run: |
          mkdir extracted
          7z x default.gradle.7z -oextracted -y
          find extracted -maxdepth 5 -print

      - name: Copy Gradle files
        run: |
          cp -a extracted/. .
          rm -rf extracted default.gradle.7z

      - name: Commit to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Import default Gradle configuration"
          git push
          
