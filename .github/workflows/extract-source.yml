
name: Extract Mappings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Download mappings archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p archive
          gh release download 1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "mappings.*" \
            --dir archive

          ls -lh archive/

      - name: Extract mappings
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          archive="$(find archive -maxdepth 1 -type f | head -n 1)"

          if [ -z "$archive" ]; then
            echo "ERROR: mappings archive not found"
            exit 1
          fi

          case "$archive" in
            *.zip)
              unzip -o "$archive" -d extracted
              ;;
            *.7z)
              7z x "$archive" -oextracted -y
              ;;
            *)
              echo "ERROR: Unsupported archive format"
              exit 1
              ;;
          esac

          source_dir="$(find extracted -type f -name original-abi.json -printf '%h\n' | head -n 1)"

          if [ -z "$source_dir" ]; then
            echo "ERROR: original-abi.json not found in archive"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          mkdir -p mappings
          cp -a "$source_dir/." mappings/

          test -f mappings/original-abi.json

          echo "Mappings extracted successfully:"
          find mappings -maxdepth 2 -type f

      - name: Commit mappings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mappings/

          if git diff --cached --quiet; then
            echo "No mappings changes"
            exit 0
          fi

          git commit -m "Import mappings files"
          git push
          
